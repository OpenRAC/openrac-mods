name: Submit a mod
description: List your mod (or a modpack) in the OpenRAC mod index. The bot checks it and opens a pull request.
title: "Submit: "
labels: [mod-submission]
body:
  - type: markdown
    attributes:
      value: |
        A mod needs a public GitHub repository with a release, and you need write access to it.
        Fill what you can; the bot answers with a checklist, each problem with its fix. Edit this issue to run it again.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Mod
        - Modpack
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository
      description: "Your mod's public GitHub repository, https://github.com/owner/repo (not needed for a modpack)."
      placeholder: https://github.com/owner/repo
  - type: input
    id: mods
    attributes:
      label: Mod ids
      description: "Comma-separated ids of the mods to list from the repository. For a modpack: the mods it includes, as id@>=1.0.0 (or just id)."
      placeholder: lock-strafe, camera-tweaks
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Modpack name
      description: Modpacks only. Its id is made from this name.
  - type: textarea
    id: settings
    attributes:
      label: Modpack settings
      description: "Modpacks only, optional: values the pack gives its mods' settings, one per line as mod-id.key = value (true or false, a number, or text). Each is checked against the mod's openrac-mod.json. The launcher sets them when the pack is installed or updated, never over a value the player chose. Changing them makes a new version of the pack."
      placeholder: "rac1-enhanced-movement.camera = rac2"
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: One paragraph, plain text, at most 300 characters. Empty takes the manifest's.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Must be chosen strictly from this allowed list (custom tags are not supported): gameplay, controls, cosmetic, qol, speedrun, randomizer, multiplayer, accessibility, camera, audio, ui, tools. Comma-separated."
      placeholder: gameplay, qol
  - type: input
    id: impact
    attributes:
      label: Impact
      description: "Must be chosen strictly from this allowed list (custom values are not supported): cosmetic, gameplay, speedrun-safe, touches-saves, online. Comma-separated."
      placeholder: gameplay
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: "Did AI tools help make this mod? Shown on its page. Required for a mod, not needed for a modpack."
      options:
        - "Yes"
        - "No"
  - type: input
    id: bugs
    attributes:
      label: Bug tracker
      placeholder: https://github.com/owner/repo/issues
  - type: input
    id: discord
    attributes:
      label: Discord
      placeholder: https://discord.gg/...
  - type: input
    id: docs
    attributes:
      label: Docs
      placeholder: https://...
  - type: input
    id: page
    attributes:
      label: Mod page file
      description: "A Markdown file, such as a page written for players, that the mod's page shows instead of README.md: a path from the folder of its openrac-mod.json. Empty shows README.md. Not needed for a modpack."
      placeholder: HUB.md
  - type: input
    id: video
    attributes:
      label: YouTube video
      description: A YouTube link (youtube.com or youtu.be). No other video hosts.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Paste or drag in pictures from your computer (PNG, JPEG, WebP, AVIF or GIF, at most 15 MB each), one per line. Leave what GitHub writes as it is. To add a caption, put ' | ' and the caption after it on the same line. A picture captioned icon or banner becomes the icon or banner. Links to pictures hosted elsewhere don't work: upload them here."
      placeholder: "<img ... src=\"https://github.com/user-attachments/assets/...\" /> | Strafing in Blarg"
  - type: checkboxes
    id: rules
    attributes:
      label: Content rules
      description: See [CONTENT.md](https://github.com/OpenRAC/openrac-mods/blob/master/CONTENT.md).
      options:
        - label: My mod follows the content rules
          required: true
